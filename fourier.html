<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quantum Fourier Engine - Deep Space Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; filter: contrast(1.2) brightness(1.1); }
        
        /* HUD Panel */
        #hud { position: absolute; top: 20px; left: 20px; color: #00FFCC; z-index: 10; font-size: 11px; text-shadow: 0 0 8px #00FFCC; pointer-events: none; background: rgba(0, 0, 0, 0.6); padding: 15px; border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 5px; backdrop-filter: blur(5px); }
        #hud h1 { font-size: 18px; margin: 0 0 10px 0; color: #FF0055; text-shadow: 0 0 15px #FF0055; letter-spacing: 3px; }
        .data-row { display: flex; justify-content: space-between; width: 280px; margin-bottom: 5px; border-bottom: 1px solid rgba(0, 255, 204, 0.1); padding-bottom: 3px; }
        .data-label { color: #666; }
        .data-value { color: #fff; font-weight: bold; }
        .data-value.highlight { color: #FF0055; text-shadow: 0 0 5px #FF0055; }
        
        /* Progress Bar */
        .progress-container { width: 280px; height: 3px; background: #111; margin-top: 15px; border-radius: 2px; overflow: hidden; box-shadow: 0 0 10px rgba(0,255,204,0.3); }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #00FFCC, #FF0055, #00FFCC); width: 0%; background-size: 200% 100%; animation: gradientShift 2s linear infinite; }
        @keyframes gradientShift { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
    </style>
</head>
<body>
    <div id="hud">
        <h1>QUANTUM FOURIER</h1>
        <div class="data-row"><span class="data-label">PROJECT:</span> <span class="data-value">ELMAN MAHAMI</span></div>
        <div class="data-row"><span class="data-label">ENGINE:</span> <span class="data-value highlight">DEEP SPACE SIM</span></div>
        <div class="data-row"><span class="data-label">EPICYCLES:</span> <span class="data-value" id="v-circles">0</span></div>
        <div class="data-row"><span class="data-label">FREQUENCY:</span> <span class="data-value" id="v-freq">0 Hz</span></div>
        <div class="data-row"><span class="data-label">AMPLITUDE:</span> <span class="data-value" id="v-amp">0.00</span></div>
        <div class="data-row"><span class="data-label">COORD X:</span> <span class="data-value" id="v-x">0.00</span></div>
        <div class="data-row"><span class="data-label">COORD Y:</span> <span class="data-value" id="v-y">0.00</span></div>
        <div class="data-row"><span class="data-label">STATUS:</span> <span class="data-value" id="v-status">INIT...</span></div>
        <div class="progress-container"><div class="progress-bar" id="v-progress"></div></div>
    </div>

    <script>
        // ==========================================
        // متغیرهای اصلی
        // ==========================================
        let time = 0;
        let direction = 1;
        let fourier = [];
        let drawing = [];
        let path = [];
        let particles = [];
        let stars = [];
        let dust = [];
        
        let zoom = 1;
        let rotY = 0;
        let rotX = 0;
        let speed = 0.015;
        let numCirclesToDraw = 150;

        // HUD Elements
        let elCircles, elFreq, elAmp, elX, elY, elStatus, elProgress;

        function setup() {
            createCanvas(800, 800);
            
            elCircles = document.getElementById('v-circles');
            elFreq = document.getElementById('v-freq');
            elAmp = document.getElementById('v-amp');
            elX = document.getElementById('v-x');
            elY = document.getElementById('v-y');
            elStatus = document.getElementById('v-status');
            elProgress = document.getElementById('v-progress');

            // ==========================================
            // 1. ساخت ستاره‌های پس‌زمینه (Starfield)
            // ==========================================
            for (let i = 0; i < 500; i++) {
                stars.push({
                    x: random(-width * 2, width * 2),
                    y: random(-height * 2, height * 2),
                    z: random(0.1, 1.5),
                    size: random(1, 4),
                    twinkle: random(TWO_PI)
                });
            }

            // ==========================================
            // 2. ساخت غبار فضایی (Space Dust)
            // ==========================================
            for (let i = 0; i < 200; i++) {
                dust.push({
                    x: random(-width, width),
                    y: random(-height, height),
                    vx: random(-0.5, 0.5),
                    vy: random(-0.5, 0.5),
                    size: random(1, 2),
                    alpha: random(50, 150)
                });
            }

            // ==========================================
            // 3. ساخت مسیر با ترکیب معادلات فضایی
            // ==========================================
            for (let i = 0; i < 1500; i++) {
                let t = map(i, 0, 1500, 0, TWO_PI * 3); 
                
                // پروانه (Butterfly)
                let bx = sin(t) * (exp(cos(t)) - 2*cos(4*t) - pow(sin(t/12), 5));
                let by = cos(t) * (exp(cos(t)) - 2*cos(4*t) - pow(sin(t/12), 5));
                
                // سوپرفرمولا (Superformula)
                let a = 1, b = 1, m = 7, n1 = 0.3, n2 = 0.3, n3 = 0.3;
                let r = pow(pow(abs(cos(m*t/4)/a), n2) + pow(abs(sin(m*t/4)/b), n3), -1/n1);
                let sfx = r * cos(t);
                let sfy = r * sin(t);

                // جاذب لورنز (Lorenz Attractor)
                let lx = sin(t) * (cos(t*3) * 20 + sin(t*5) * 10);
                let ly = cos(t) * (sin(t*3) * 20 + cos(t*5) * 10);

                // ⚡ ترکیب نهایی ⚡
                let x = (bx * 20) + (sfx * 15) + (lx * 0.5); 
                let y = (by * 20) + (sfy * 15) + (ly * 0.5);
                
                path.push(createVector(x, y));
            }
            
            fourier = dft(path);
            fourier.sort((a, b) => b.amp - a.amp);
        }

        function draw() {
            // پس‌زمینه سیاه با Motion Blur
            background(0, 0, 5, 60);
            
            // ==========================================
            // رسم ستاره‌های پس‌زمینه با نویز پرلین
            // ==========================================
            push();
            translate(width/2, height/2);
            noStroke();
            for (let s of stars) {
                let sx = s.x * (zoom * 0.5) + rotY * 50;
                let sy = s.y * (zoom * 0.5) + rotX * 50;
                
                // افکت چشمک زدن
                let twinkle = sin(frameCount * 0.05 + s.twinkle) * 0.5 + 0.5;
                fill(255, 255, 255, 150 * s.z * twinkle);
                ellipse(sx, sy, s.size * s.z);
            }
            pop();

            // ==========================================
            // رسم غبار فضایی
            // ==========================================
            push();
            translate(width/2, height/2);
            for (let d of dust) {
                d.x += d.vx;
                d.y += d.vy;
                
                // برگشت به صفحه
                if (d.x > width) d.x = -width;
                if (d.x < -width) d.x = width;
                if (d.y > height) d.y = -height;
                if (d.y < -height) d.y = height;
                
                noStroke();
                fill(100, 150, 255, d.alpha);
                ellipse(d.x * zoom, d.y * zoom, d.size);
            }
            pop();

            // اعمال چرخش و زوم
            translate(width / 2, height / 2);
            rotate(rotY);
            scale(zoom);

            let x = 0;
            let y = 0;

            // ==========================================
            // ⚡ موتور رندر دایره‌ها و هاله کوانتومی ⚡
            // ==========================================
            let currentCircles = min(numCirclesToDraw, fourier.length);
            
            for (let i = 0; i < currentCircles; i++) {
                let prevx = x;
                let prevy = y;
                
                let freq = fourier[i].freq;
                let radius = fourier[i].amp;
                let phase = fourier[i].phase;
                
                // عمق فضایی
                let zDepth = sin(time * 2 + i * 0.1);
                let alphaVal = map(zDepth, -1, 1, 20, 180);
                
                // رسم دایره‌ها
                if (i < 80) {
                    // هاله بیرونی (Lens Flare)
                    stroke(0, 255, 204, alphaVal * 0.1);
                    strokeWeight(8);
                    noFill();
                    ellipse(prevx, prevy, radius * 2);
                    
                    // خط دایره
                    stroke(0, 255, 204, alphaVal * 0.5);
                    strokeWeight(0.6);
                    ellipse(prevx, prevy, radius * 2);
                }

                x += radius * cos(freq * time + phase);
                y += radius * sin(freq * time + phase);

                // خطوط اتصال
                if (i < 20) {
                    stroke(255, 0, 85, alphaVal * 0.6);
                    strokeWeight(1);
                    line(prevx, prevy, x, y);
                }
            }

            // ==========================================
            // ⚡ سیستم ذرات فضایی (Quantum Particles) ⚡
            // ==========================================
            if (frameCount % 2 === 0 && direction === 1) {
                particles.push({
                    x: x, y: y,
                    vx: random(-2, 2), vy: random(-2, 2),
                    life: 255, size: random(1, 5),
                    color: random() > 0.5 ? [0, 255, 204] : [255, 0, 85]
                });
            }
            
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 5;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    noStroke();
                    fill(p.color[0], p.color[1], p.color[2], p.life * 0.5);
                    ellipse(p.x, p.y, p.size);
                }
            }

            // ==========================================
            // ⚡ منطق رفت و برگشت و آپدیت HUD ⚡
            // ==========================================
            if (direction === 1) {
                drawing.unshift(createVector(x, y));
                if (drawing.length > path.length) drawing.pop(); 
                time += speed;
                
                let progress = map(time, 0, TWO_PI * 3, 0, 100);
                elProgress.style.width = progress + "%";
                elStatus.innerText = "EXPANDING SPACE";
                elStatus.style.color = "#00FFCC";
                
                if (time > TWO_PI * 3) direction = -1;
            } else {
                if (drawing.length > 0) drawing.pop();
                time -= speed;
                
                let progress = map(time, 0, TWO_PI * 3, 0, 100);
                elProgress.style.width = progress + "%";
                elStatus.innerText = "COLLAPSING SPACE";
                elStatus.style.color = "#FF0055";
                
                if (time < 0) direction = 1;
            }
            
            // آپدیت HUD
            elCircles.innerText = currentCircles;
            elFreq.innerText = Math.floor(Math.abs(fourier[currentCircles-1].freq)) + " Hz";
            elAmp.innerText = fourier[currentCircles-1].amp.toFixed(2);
            elX.innerText = x.toFixed(2);
            elY.innerText = y.toFixed(2);

            // ==========================================
            // ⚡ رندر خط نهایی با افکت درخشش کوانتومی ⚡
            // ==========================================
            // لایه هاله بزرگ
            stroke(255, 255, 255, 15);
            strokeWeight(20);
            noFill();
            beginShape();
            for (let i = 0; i < drawing.length; i++) vertex(drawing[i].x, drawing[i].y);
            endShape();

            // لایه میانی (نئون)
            stroke(0, 255, 204, 60);
            strokeWeight(6);
            noFill();
            beginShape();
            for (let i = 0; i < drawing.length; i++) vertex(drawing[i].x, drawing[i].y);
            endShape();

            // لایه اصلی (خط تیز)
            stroke(255);
            strokeWeight(1);
            noFill();
            beginShape();
            for (let i = 0; i < drawing.length; i++) vertex(drawing[i].x, drawing[i].y);
            endShape();

            // نقطه متحرک (هسته سیاه‌چاله)
            noStroke();
            fill(255, 0, 85, 30);
            ellipse(x, y, 50);
            fill(0, 255, 204, 80);
            ellipse(x, y, 25);
            fill(255);
            ellipse(x, y, 8);
        }

        // تابع تبدیل فوریه
        function dft(x) {
            const X = [];
            const N = x.length;
            for (let k = 0; k < N; k++) {
                let re = 0;
                let im = 0;
                for (let n = 0; n < N; n++) {
                    const phi = (TWO_PI * k * n) / N;
                    re += x[n].x * cos(phi) - x[n].y * sin(phi);
                    im += x[n].x * sin(phi) + x[n].y * cos(phi);
                }
                re = re / N;
                im = im / N;
                let freq = k;
                let amp = sqrt(re * re + im * im);
                let phase = atan2(im, re);
                X[k] = { re, im, freq, amp, phase };
            }
            return X;
        }

        // تعامل با موس
        function mouseWheel(event) {
            if (event.delta > 0) zoom *= 1.05;
            else zoom *= 0.95;
            zoom = constrain(zoom, 0.1, 30.0);
            return false;
        }

        function mouseDragged() {
            rotY += (mouseX - pmouseX) * 0.01;
            rotX += (mouseY - pmouseY) * 0.01;
        }

        // تعامل با کیبورد
        function keyPressed() {
            if (keyCode === UP_ARROW) speed += 0.005;
            if (keyCode === DOWN_ARROW) speed -= 0.005;
            if (keyCode === LEFT_ARROW) numCirclesToDraw -= 5;
            if (keyCode === RIGHT_ARROW) numCirclesToDraw += 5;
            speed = constrain(speed, 0.001, 0.1);
            numCirclesToDraw = constrain(numCirclesToDraw, 10, 300);
        }
    </script>
</body>
</html>
